[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["openai", "mongodb"]

# API → Netlify Functions (must come before SPA fallback)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

[[redirects]]
  from = "/api/visitors"
  to = "/.netlify/functions/visitors"
  status = 200
  force = true

[[redirects]]
  from = "/api/ingest"
  to = "/.netlify/functions/ingest"
  status = 200
  force = true

[[redirects]]
  from = "/services"
  to = "/.netlify/functions/services-page"
  status = 200
  force = true

[[redirects]]
  from = "/services/*"
  to = "/.netlify/functions/services-page"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/blog-page"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/blog-page"
  status = 200
  force = true

[[redirects]]
  from = "/api/blog/auth"
  to = "/.netlify/functions/blog-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/blog/articles"
  to = "/.netlify/functions/blog-articles"
  status = 200
  force = true

[[redirects]]
  from = "/api/blog/upload"
  to = "/.netlify/functions/blog-upload"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/blog-sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/blog-feed"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/share"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
